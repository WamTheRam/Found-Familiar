name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ] && npm ci --no-audit --no-fund; then
            echo "Installed from package-lock.json"
          else
            echo "::warning::package-lock.json is missing or out of date; falling back to npm install."
            npm install --no-audit --no-fund
          fi

      - name: Build web app
        run: npm run build

      - name: Create or sync the Android project
        run: |
          if [ -d android ]; then
            echo "android/ exists: syncing"
            npx cap sync android
          else
            echo "android/ not found: creating it"
            npx cap add android
          fi

      - name: Apply app icon and launch screen
        run: |
          RES=android/app/src/main/res
          # Remove Capacitor's default launch-screen images, then add our icon and plain parchment launch background.
          rm -f "$RES"/drawable*/splash.png
          cp -R android-overrides/res/. "$RES/"

      - name: Use the repository's debug signing key
        run: |
          # A fixed debug key means each new APK can update the one on your phone without uninstalling (which would erase its data).
          mkdir -p "$HOME/.android"
          cp android-overrides/debug.keystore "$HOME/.android/debug.keystore"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-36"
          else
            echo "::warning::sdkmanager not found; relying on Gradle to download SDK components."
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: found-familiar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
